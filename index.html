<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Code Repository</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        p {
            color: var(--text-muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: var(--text-muted);
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
        }
        .card a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .card p {
            flex-grow: 1;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }
        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to c's world</h1>
        <p>A collection of development work.</p>
    </header>

    <div class="grid" id="repo-container">
        <p style="text-align: center; width: 100%;">Loading repositories...</p>
    </div>

    <script>
        // --- IMPORTANT: CHANGE THIS TO YOUR ACTUAL GITHUB USERNAME ---
        const githubUsername = 'ABBHINAV'; 

        async function fetchRepos() {
            const container = document.getElementById('repo-container');
            
            try {
                const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const repos = await response.json();
                container.innerHTML = ''; // Clear loading text

                // Filter out forks if you only want your original code
                const originalRepos = repos.filter(repo => !repo.fork);

                originalRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Format the language (handle null values)
                    const language = repo.language ? repo.language : 'N/A';
                    
                    // Format the description (handle null values)
                    const description = repo.description ? repo.description : 'No description provided.';

                    card.innerHTML = `
                        <h2><a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a></h2>
                        <p>${description}</p>
                        <div class="meta">
                            <span>● ${language}</span>
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🔄 Updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = `<p style="text-align: center; color: red;">Error loading repositories. Check the username in the script.</p>`;
                console.error('Error fetching repos:', error);
            }
        }

        fetchRepos();
    </script>
</body>
</html>
